apiVersion: v1
kind: Service
metadata:
  name: aap-bridge
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: aap-bridge-tls
spec:
  selector:
    app: aap-bridge
  ports:
  - name: https
    port: 443
    targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: aap-bridge-db
spec:
  clusterIP: None
  selector:
    app: aap-bridge-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: aap-bridge
  annotations:
    haproxy.router.openshift.io/timeout: 300s
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  to:
    kind: Service
    name: aap-bridge
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
