apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-bridge
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"aap-bridge"}}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-bridge-db
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-bridge-access
rules:
- apiGroups:
  - ''
  resources:
  - services
  resourceNames:
  - aap-bridge
  verbs:
  - get
