apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aap-bridge
spec:
  podSelector:
    matchLabels:
      app: aap-bridge
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ''
    ports:
    - protocol: TCP
      port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aap-bridge-db
spec:
  podSelector:
    matchLabels:
      app: aap-bridge-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aap-bridge
    ports:
    - protocol: TCP
      port: 5432
