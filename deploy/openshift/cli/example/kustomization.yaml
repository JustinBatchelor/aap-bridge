apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../cli
namespace: aap-bridge-cli
images:
- name: aap-bridge-cli
  newName: REPLACE_WITH_CLI_REPOSITORY
  digest: REPLACE_WITH_CLI_SHA256_DIGEST
patches:
- target:
    kind: PersistentVolumeClaim
  patch: |-
    - op: add
      path: /spec/storageClassName
      value: REPLACE_WITH_STORAGE_CLASS
- target:
    kind: ServiceAccount
  patch: |-
    - op: add
      path: /imagePullSecrets
      value:
        - name: vendor-pull
