source:
  url: ${SOURCE_AAP_URL}
  version: ${SOURCE_AAP_VERSION}
  token: ${SOURCE_AAP_TOKEN}
  verify_ssl: true
  timeout: 30
target:
  url: ${TARGET_AAP_URL}
  version: ${TARGET_AAP_VERSION}
  token: ${TARGET_AAP_TOKEN}
  verify_ssl: true
  timeout: 30
paths:
  export_dir: /data/exports
  transform_dir: /data/xformed
  schema_dir: /data/schemas
  report_dir: /data/reports
  backup_dir: /data/backups
  ignored_endpoints_file: /app/config/ignored_endpoints.yaml
  mappings_file: /app/config/mappings.yaml
  base_dir: /data
logging:
  level: INFO
  format: json
  file: /data/logs/migration.log
performance:
  memory_limit_mb: 3072
  batch_sizes:
    default: 100
    hosts: 100
state:
  db_path: ${MIGRATION_STATE_DB_PATH}
