# Copy to local/build-test/install/kustomization.yaml before rendering.
# Fill image entries from build-images.py output and the cluster OAuth component.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aap-bridge-build-test
resources:
  - ../../../base
images:
  - name: aap-bridge-api
    newName: REPLACE_WITH_API_REPOSITORY
    digest: REPLACE_WITH_API_SHA256_DIGEST
  - name: aap-bridge-ui
    newName: REPLACE_WITH_UI_REPOSITORY
    digest: REPLACE_WITH_UI_SHA256_DIGEST
  - name: oauth-proxy
    newName: REPLACE_WITH_OAUTH_PROXY_REPOSITORY
    digest: REPLACE_WITH_OAUTH_PROXY_SHA256_DIGEST
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: REPLACE_WITH_STORAGE_CLASS
  - target:
      kind: Route
      name: aap-bridge
    patch: |-
      - op: add
        path: /spec/host
        value: REPLACE_WITH_ROUTE_HOST
  - target:
      kind: ServiceAccount
      name: aap-bridge
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: vendor-pull
  - target:
      kind: ServiceAccount
      name: aap-bridge-db
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: vendor-pull
