apiVersion: v1
kind: Secret
metadata:
  name: aap-bridge-db
type: Opaque
stringData:
  POSTGRESQL_USER: aap_bridge
  POSTGRESQL_DATABASE: aap_bridge
  POSTGRESQL_PASSWORD: REPLACE
  POSTGRESQL_ADMIN_PASSWORD: REPLACE
---
apiVersion: v1
kind: Secret
metadata:
  name: aap-bridge
type: Opaque
stringData:
  MIGRATION_STATE_DB_PATH: postgresql://aap_bridge:REPLACE@aap-bridge-db:5432/aap_bridge
  AAP_BRIDGE_TOKEN_ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: aap-bridge-oauth
type: Opaque
stringData:
  cookie-secret: REPLACE_WITH_BASE64_32_RANDOM_BYTES
